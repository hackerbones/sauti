<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
<link rel="alternate icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sauti" />
<meta name="description" content="Stream full-length music for free and download tracks for offline listening." />
<title>Sauti — Stream & Download Music</title>
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000; --panel:#121212; --panel2:#1f1f1f; --hover:#2a2a2a; --line:#2a2a2a;
    --text:#fff; --muted:#b3b3b3; --dim:#7a7a7a; --accent:#ff7a3d; --accent2:#ffb347; --good:#3ddc97;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  a{color:inherit}
  svg{width:20px;height:20px;flex:none}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:3px solid transparent;background-clip:padding-box;border-radius:10px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- layout ---------- */
  .app{display:grid;height:100vh;height:100dvh;padding:8px;gap:8px;padding-top:max(8px,env(safe-area-inset-top));
    grid-template-columns:300px minmax(0,1fr) 0;grid-template-rows:56px minmax(0,1fr) 80px;
    grid-template-areas:"top top top" "lib main np" "player player player"}
  body.np-open .app{grid-template-columns:300px minmax(0,1fr) 320px}
  .panel{background:var(--panel);border-radius:var(--radius);overflow:hidden;min-height:0}

  /* top bar */
  .topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 8px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.5px;padding:0 8px;white-space:nowrap}
  .logo i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-style:normal;font-size:16px;color:#1a0d05}
  .navbtn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;color:var(--muted)}
  .navbtn:hover{color:var(--text)}
  .navbtn:disabled{opacity:.4;cursor:default}
  .center{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0}
  .homebtn{width:48px;height:48px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--muted);flex:none}
  .homebtn:hover{background:var(--hover);color:var(--text);transform:scale(1.04)}
  .homebtn.on{color:var(--text)}
  .homebtn svg{width:24px;height:24px}
  .search{flex:1;max-width:480px;height:48px;display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:500px;padding:0 16px;border:2px solid transparent;color:var(--muted)}
  .search:hover{background:var(--hover);border-color:#3a3a3a}
  .search:focus-within{border-color:var(--text);color:var(--text)}
  .search svg{width:22px;height:22px}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px;color:var(--text)}
  .search input::placeholder{color:var(--muted)}
  .search .clear{color:var(--muted);font-size:18px;display:none}
  .search.has .clear{display:block}
  .tright{display:flex;align-items:center;gap:8px}
  .pill{height:32px;padding:0 16px;border-radius:500px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .pill.white{background:#fff;color:#000}
  .pill.white:hover{transform:scale(1.04)}
  .pill.ghost{color:var(--muted)}
  .pill.ghost:hover{color:var(--text);transform:scale(1.04)}
  #installBtn{display:none}
  #installBtn.show{display:inline-flex}

  /* library sidebar */
  .lib{grid-area:lib;display:flex;flex-direction:column}
  .lib-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
  .lib-head h2{font-size:16px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:10px}
  .lib-head h2 svg{width:24px;height:24px}
  .roundic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .roundic:hover{background:var(--panel2);color:var(--text)}
  .lib-chips{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap}
  .chip{height:32px;padding:0 12px;border-radius:500px;background:var(--panel2);font-size:14px;color:var(--text);white-space:nowrap}
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--text);color:#000}
  .lib-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
  .li{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;cursor:pointer;width:100%;text-align:left}
  .li:hover{background:var(--panel2)}
  .li.on{background:var(--hover)}
  .li .lart{width:48px;height:48px;border-radius:4px;flex:none;object-fit:cover;overflow:hidden}
  .li .lart.round{border-radius:50%}
  .li .ltxt{min-width:0}
  .li .lname{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li.on .lname{color:var(--accent)}
  .li .lsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .tile-liked{background:linear-gradient(135deg,#450af5,#c4efd9);display:grid;place-items:center;color:#fff}
  .tile-dl{background:linear-gradient(135deg,#0d7a52,#3ddc97);display:grid;place-items:center;color:#fff}
  .tile-follow{background:linear-gradient(135deg,#a23b06,#ffb347);display:grid;place-items:center;color:#fff}
  .lib-foot{padding:12px 16px;font-size:11px;color:var(--dim);line-height:1.5;border-top:1px solid #1d1d1d}
  .lib-foot a{color:var(--muted)}

  /* main */
  main.panel{grid-area:main;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
  .grad{background:linear-gradient(180deg,var(--hc,#333) 0,rgba(18,18,18,0) 340px);min-height:100%}
  .pad{padding:16px 24px 40px}
  .greet{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:8px 0 18px}
  h2.sec{font-size:24px;font-weight:700;letter-spacing:-.3px;margin:32px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
  h2.sec small{font-size:14px;font-weight:700;color:var(--muted)}
  .sub{color:var(--muted);font-size:14px;margin:-8px 0 14px}

  /* home tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
  .tile{display:flex;align-items:center;gap:0;height:64px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;cursor:pointer;position:relative;text-align:left}
  .tile:hover{background:rgba(255,255,255,.18)}
  .tile .tart{width:64px;height:64px;flex:none;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .tile .tname{font-weight:700;font-size:15px;padding:0 56px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .cplay{right:12px;bottom:auto;top:12px;width:40px;height:40px}

  /* card shelves */
  .shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,180px);gap:4px;overflow-x:auto;margin:0 -12px;padding:0 0 8px}
  .card{padding:12px;border-radius:6px;cursor:pointer;position:relative;text-align:left;min-width:0}
  .card:hover{background:var(--panel2)}
  .card .cart{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;display:block;box-shadow:0 8px 24px rgba(0,0,0,.5);margin-bottom:10px;overflow:hidden}
  .card .cart.round{border-radius:50%}
  .cart.ph,.tart.ph,.lart.ph,.part.ph{display:grid;place-items:center}
  .card .cname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .csub{font-size:13px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cplay{position:absolute;right:20px;top:calc(100% - 110px);width:48px;height:48px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s}
  .card:hover .cplay,.tile:hover .cplay{opacity:1;transform:none}
  .cplay:hover{transform:scale(1.06)!important;background:var(--accent2)}
  .cplay svg{width:22px;height:22px}
  .browse{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .gcard{position:relative;aspect-ratio:1.6;border-radius:8px;overflow:hidden;padding:14px;font-size:22px;font-weight:800;text-align:left;cursor:pointer;letter-spacing:-.3px}
  .gcard::after{content:'♪';position:absolute;right:-6px;bottom:-14px;font-size:84px;transform:rotate(25deg);opacity:.35}

  /* page header */
  .phead{display:flex;align-items:flex-end;gap:24px;padding:72px 24px 24px;background:linear-gradient(180deg,transparent 0,rgba(0,0,0,.45) 100%)}
  .phead .part{width:232px;height:232px;flex:none;border-radius:6px;box-shadow:0 4px 60px rgba(0,0,0,.5);object-fit:cover;overflow:hidden}
  .phead .part.round{border-radius:50%}
  .phead .part svg{width:80px;height:80px}
  .kind{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .ptitle{font-size:clamp(32px,6.2vw,92px);font-weight:900;letter-spacing:-.04em;line-height:1;margin:8px 0 14px;word-break:break-word}
  .ptitle.sm{font-size:clamp(28px,4.5vw,64px)}
  .pmeta{font-size:14px;color:rgba(255,255,255,.75);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pmeta b{color:var(--text)}
  .dot::before{content:'•';margin-right:6px}
  .artist-banner{position:relative;height:clamp(240px,34vh,400px);display:flex;align-items:flex-end;padding:24px;background:var(--hc) center/cover no-repeat}
  .artist-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
  .artist-banner > *{position:relative}
  .artist-banner .ptitle{text-shadow:0 2px 20px rgba(0,0,0,.35)}
  .verified{width:24px;height:24px;color:#4da3ff}
  .abar{display:flex;align-items:center;gap:20px;padding:24px;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 140px)}
  .bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.3);flex:none}
  .bigplay:hover{transform:scale(1.05);background:var(--accent2)}
  .bigplay svg{width:26px;height:26px}
  .abar .ic{width:40px;height:40px;color:var(--muted)}
  .abar .ic svg{width:28px;height:28px}
  .abar .ic:hover{color:var(--text);transform:scale(1.05)}
  .abar .ic.on{color:var(--accent)}
  .outline{height:32px;padding:0 16px;border-radius:500px;border:1px solid #7c7c7c;font-size:14px;font-weight:700}
  .outline:hover{border-color:#fff;transform:scale(1.04)}
  .outline.following{border-color:var(--accent);color:var(--accent)}
  .follow-mini{margin-top:8px;padding:4px 12px;font-size:12px;font-weight:700;border-radius:500px;border:1px solid #7c7c7c}
  .follow-mini:hover{border-color:#fff}
  .follow-mini.following{border-color:var(--accent);color:var(--accent)}
  .content{padding:0 24px 40px}

  /* track table */
  .list{display:flex;flex-direction:column}
  .thead,.row{display:grid;grid-template-columns:32px minmax(0,4fr) minmax(0,2fr) minmax(150px,1fr);gap:16px;align-items:center;padding:0 16px}
  .thead{height:36px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);margin-bottom:8px;position:sticky;top:0;background:var(--panel);z-index:2}
  .thead .r{text-align:right;display:flex;justify-content:flex-end}
  .thead svg{width:16px;height:16px}
  .row{height:56px;border-radius:4px;cursor:default}
  .row:hover{background:rgba(255,255,255,.1)}
  .row.sel{background:rgba(255,255,255,.2)}
  .num{color:var(--muted);text-align:center;font-size:15px;position:relative;display:grid;place-items:center}
  .num .pi{display:none;color:var(--text)}
  .num .pi svg{width:16px;height:16px}
  .row:hover .num .n{display:none}
  .row:hover .num .pi{display:block}
  .row.playing .t-title{color:var(--accent)}
  .row.playing .num .n{color:var(--accent)}
  .tt{display:flex;align-items:center;gap:12px;min-width:0}
  .art{width:40px;height:40px;border-radius:4px;object-fit:cover;background:var(--panel2);flex:none}
  .ph{display:grid;place-items:center;background:linear-gradient(135deg,#3a3a3a,#242424);color:var(--muted)}
  .tx{min-width:0}
  .t-title{font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-artist{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .row:hover .t-artist{color:var(--text)}
  .a-link{cursor:pointer}
  .a-link:hover{text-decoration:underline;color:var(--text)}
  .genre{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .end{display:flex;align-items:center;justify-content:flex-end;gap:4px}
  .dur{color:var(--muted);font-size:14px;width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .acts{display:flex;align-items:center;gap:0}
  .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .ic:hover{color:var(--text)}
  .ic svg{width:18px;height:18px}
  .acts .ic{opacity:0}
  .row:hover .acts .ic,.acts .ic.on,.acts .ic.done,.acts .ic:disabled{opacity:1}
  .ic.on{color:var(--accent)}
  .ic.done{color:var(--good)}
  .ic:disabled{cursor:default}
  .ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
  .eq b{width:3px;background:var(--accent);animation:eq 1s ease-in-out infinite}
  .eq b:nth-child(2){animation-delay:-.4s}.eq b:nth-child(3){animation-delay:-.7s}
  .paused .eq b{animation-play-state:paused}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  .offline-badge{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--good);color:#000;font-size:10px;font-weight:900;margin-right:6px;vertical-align:-2px}
  .yt-badge{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:#e62117;border-radius:3px;padding:1px 4px;margin-right:6px;vertical-align:1px}
  .feed-date{color:var(--muted);font-size:13px}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
  .empty h3{color:var(--text);font-size:24px;font-weight:700;margin-bottom:10px}
  .empty .pill{margin-top:20px}
  .loader{display:grid;place-items:center;padding:60px}
  .loader .ring{width:32px;height:32px;border-width:3px}
  .drop{border:2px dashed #3a3a3a;border-radius:8px;padding:16px;text-align:center;color:var(--muted);margin:0 0 16px;font-size:14px}
  .drop.over{border-color:var(--accent);color:var(--text)}
  .seg{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .about{margin-top:32px;border-radius:8px;overflow:hidden;background:var(--panel2);max-width:680px;cursor:default}
  .about .acover{height:200px;background:var(--hc,#333) center/cover}
  .about .abody{padding:20px;color:var(--muted);font-size:15px;line-height:1.55;white-space:pre-line}
  .about .abody b{color:var(--text);font-size:16px;display:block;margin-bottom:6px;white-space:normal}

  /* now playing panel */
  .np{grid-area:np;display:flex;flex-direction:column}
  body:not(.np-open) .np{display:none}
  .np-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;font-weight:700}
  .np-body{flex:1;overflow-y:auto;padding:8px 16px 20px}
  .np-art{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.5);display:grid;place-items:center;font-size:64px}
  .np-title{display:flex;align-items:center;gap:8px;margin:18px 0 4px}
  .np-title > div{flex:1;min-width:0}
  .np-title .t-title{font-size:24px;font-weight:800;letter-spacing:-.3px}
  .np-title .t-artist{font-size:15px}
  .np-card{background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:18px}
  .np-card .nc-cover{height:160px;background:var(--hc,#333) center/cover;position:relative}
  .np-card .nc-cover span{position:absolute;left:14px;top:12px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .np-card .nc-body{padding:14px 16px 16px}
  .np-card .nc-body b{font-size:16px}
  .np-card .nc-body p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  .np-card .nc-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .np-card h4{font-size:15px;padding:14px 16px 6px;display:flex;justify-content:space-between}
  .np-card h4 button{font-size:13px;color:var(--muted);font-weight:700}
  .q-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}
  .q-item:hover{background:var(--hover)}
  .q-item.cur .t-title{color:var(--accent)}
  .q-item .art{width:48px;height:48px}
  .q-item > div{min-width:0;flex:1}
  .q-label{font-size:16px;font-weight:700;margin:18px 0 6px}
  .np-ctrl{display:none}

  /* player bar */
  footer{grid-area:player;display:grid;grid-template-columns:minmax(180px,30%) minmax(0,40%) minmax(180px,30%);align-items:center;padding:0 8px}
  .now{display:flex;gap:14px;align-items:center;min-width:0}
  .now .art{width:56px;height:56px;border-radius:4px;cursor:pointer}
  .now > div{min-width:0}
  .now .t-title{font-size:14px}
  .now .t-artist{font-size:12px}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ctrl .btns{display:flex;align-items:center;gap:16px}
  .ctrl .ic{width:32px;height:32px}
  .ctrl .ic svg{width:16px;height:16px}
  .ctrl .ic.on{color:var(--accent);position:relative}
  .ctrl .ic.on::after{content:'';position:absolute;bottom:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
  .play{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
  .play:hover{transform:scale(1.06)}
  .play svg{width:16px;height:16px}
  .bar{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar span{min-width:40px;text-align:center}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(to right,var(--text) var(--p,0%),#4d4d4d var(--p,0%));outline:0;cursor:pointer}
  input[type=range]:hover{background:linear-gradient(to right,var(--accent) var(--p,0%),#4d4d4d var(--p,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
  input[type=range]:hover::-webkit-slider-thumb{opacity:1}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
  .right{display:flex;justify-content:flex-end;align-items:center;gap:4px}
  .right .ic svg{width:18px;height:18px}
  .right input{max-width:96px}

  .mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;background:linear-gradient(135deg,#3a3a3a,#242424)}

<script>
/* ---------- Config ---------- */
const APP = 'Sauti';
const GENRES = ['All','Electronic','Hip-Hop/Rap','Alternative','R&B/Soul','Pop','Afrobeat','Reggae','Lo-Fi','House','Jazz','Rock','Ambient'];

/* ---------- Icons ---------- */
const I = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>',
  heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14v6h16v-6M12 4v11m0 0l-4-4m4 4l4-4"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if(!isFinite(s)||s<0) s=0; s=Math.floor(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); };
const store = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} } };
const artHTML = (t, cls='art') => t.artUrl ? `<img class="${cls}" src="${esc(t.artUrl)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls} ph',textContent:'♪'}))">` : `<div class="${cls} ph">♪</div>`;

/* ---------- Audius API ---------- */
let host = null;
async function getHost(){
  if (host) return host;
  // api.audius.co serves /v1 directly; fall back to a discovery node from its list
  try { const r = await fetch(`https://api.audius.co/v1/tracks/trending?limit=1&app_name=${APP}`); if (r.ok) return host='https://api.audius.co'; } catch {}
  const r = await fetch('https://api.audius.co'); const j = await r.json();
  const list = j.data || []; host = list[Math.floor(Math.random()*list.length)];
  if (!host) throw new Error('No Audius host available');
  return host;
}
async function api(path, params={}){
  const h = await getHost();
  const q = new URLSearchParams({...params, app_name: APP});
  const r = await fetch(`${h}/v1${path}?${q}`);
  if (!r.ok) throw new Error(`API ${r.status}`);
  return (await r.json()).data;
}
const normalize = t => ({
  id: String(t.id), title: t.title, artist: t.user?.name || t.user?.handle || 'Unknown artist',
  artistId: t.user?.id ? String(t.user.id) : '', artistHandle: t.user?.handle || '',
  genre: t.genre || '', duration: t.duration || 0, released: t.release_date || t.created_at || '',
  artUrl: t.artwork?.['480x480'] || t.artwork?.['150x150'] || '',
  source: 'audius', permalink: t.permalink ? `https://audius.co${t.permalink}` : '',
});
const normUser = u => ({
  id: String(u.id), name: u.name || u.handle || 'Unknown artist', handle: u.handle || '',
  bio: u.bio || '', location: u.location || '', verified: !!u.is_verified,
  followers: u.follower_count || 0, trackCount: u.track_count || 0,
  avatar: u.profile_picture?.['480x480'] || u.profile_picture?.['150x150'] || u.profile_picture?.['1000x1000'] || '',
  cover: u.cover_photo?.['2000x'] || u.cover_photo?.['640x'] || '',
});
const compact = n => n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(n);
const avatarHTML = u => u.avatar ? `<img class="avatar" src="${esc(u.avatar)}" alt="" loading="lazy">` : `<div class="avatar">${esc((u.name||'?')[0].toUpperCase())}</div>`;
const artistLink = t => t.artistId ? `<span class="a-link" data-artist="${esc(t.artistId)}">${esc(t.artist)}</span>` : esc(t.artist);
const streamUrl = id => `${host || 'https://api.audius.co'}/v1/tracks/${id}/stream?app_name=${APP}`;

/* ---------- IndexedDB (offline downloads) ---------- */
let dbP;
function db(){
  return dbP ||= new Promise((res, rej) => {
    const o = indexedDB.open('sauti', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('tracks', { keyPath: 'id' });
    o.onsuccess = () => res(o.result); o.onerror = () => rej(o.error);
  });
}
async function idb(mode, fn){ const d = await db(); return new Promise((res, rej) => { const tx = d.transaction('tracks', mode); const s = tx.objectStore('tracks'); const r = fn(s); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); }); }
const dbAll = () => idb('readonly', s => s.getAll());
const dbPut = v => idb('readwrite', s => s.put(v));

/* ---------- Playback engine: <audio> for Audius/local, YouTube IFrame player for YouTube ---------- */
const audio = new Audio(); audio.preload = 'auto';
audio.volume = store.get('vol', 80) / 100;
let mode = 'audio';                 // 'audio' | 'yt'
let yt = null, ytReady = null, ytState = -1, ytTick = null;

function ensureYT(){
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('ytPlayer', {
        width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin },
        events: {
          onReady: () => { applyVolume(); res(); },
          onStateChange: e => { ytState = e.data; if (e.data === 0) next(true); syncPlay(); },
          onError: e => { const why = { 2: 'bad video id', 5: 'player error', 100: 'video removed or private', 101: 'owner blocks playing outside YouTube', 150: 'owner blocks playing outside YouTube' }[e.data] || 'error';
            toast(`Can't play this one here (${why}) — skipping`); setTimeout(() => next(true), 1200); },
        },
      });
    };
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = () => { ytReady = null; rej(new Error('YouTube player failed to load')); };
    document.head.appendChild(sc);
  });
  return ytReady;
}
const pPaused = () => mode === 'yt' ? !(ytState === 1 || ytState === 3) : audio.paused;
const pTime = () => mode === 'yt' ? (yt?.getCurrentTime?.() || 0) : audio.currentTime;
const pDur = () => mode === 'yt' ? (yt?.getDuration?.() || current()?.duration || 0) : (audio.duration || current()?.duration || 0);
function pPlay(){ if (mode === 'yt') yt?.playVideo(); else audio.play().catch(() => {}); }
function pPause(){ if (mode === 'yt') yt?.pauseVideo(); else audio.pause(); }
function pSeek(sec){ sec = Math.max(0, Math.min(pDur() || 0, sec)); if (mode === 'yt') yt?.seekTo(sec, true); else audio.currentTime = sec; tickUI(); }
function applyVolume(){ const v = Math.round(audio.volume * 100); if (yt?.setVolume) { yt.setVolume(v); audio.muted ? yt.mute() : yt.unMute(); } }
function showYT(on, t){
  $('#ytPanel').classList.toggle('show', on); document.body.classList.toggle('yt-on', on);
  if (on && t) { $('#ytTitle').textContent = `${t.title} · ${t.artist}`; $('#ytOpen').href = `https://www.youtube.com/watch?v=${t.ytId}`; }
  clearInterval(ytTick); if (on) ytTick = setInterval(tickUI, 500);
}
$('#ytClose').onclick = () => { yt?.stopVideo(); ytState = -1; showYT(false); syncPlay(); };

const current = () => S.queue[S.qi];
async function playIndex(i){
  if (i < 0 || i >= S.queue.length) return;
  S.qi = i; const t = current();
  if (t.source === 'youtube') {
    audio.pause(); audio.removeAttribute('src'); mode = 'yt'; showYT(true, t);
    try { await ensureYT(); } catch (e) { toast("Couldn't load the YouTube player"); return; }
    if (current() !== t) return;
    yt.loadVideoById(t.ytId);
  } else {
    if (mode === 'yt') { yt?.stopVideo(); ytState = -1; showYT(false); }
    mode = 'audio';
    let src;
    if (S.downloads.has(t.id)) {
      if (!objectUrls.has(t.id)) { const rec = await dbGet(t.id); if (rec?.audio) objectUrls.set(t.id, URL.createObjectURL(rec.audio)); }
      src = objectUrls.get(t.id);
    }
    if (!src) { if (t.source !== 'audius') { toast('File missing'); return; } await getHost().catch(()=>{}); src = streamUrl(t.id); }
    audio.src = src;
    try { await audio.play(); } catch (e) { if (e.name !== 'AbortError') toast('Playback blocked — press play'); }
  }
  updateNow(); renderQueue(); highlight(); mediaSession(t); syncPlay();
}
function playList(list, i){ S.queue = list.slice(); if (S.shuffle) { const first = S.queue.splice(i,1)[0]; shuffleArr(S.queue); S.queue.unshift(first); i = 0; } playIndex(i); }
function shuffleArr(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function next(auto=false){
  if (!S.queue.length) return;
  if (auto && S.repeat === 'one') { pSeek(0); pPlay(); return; }
  if (S.qi + 1 < S.queue.length) playIndex(S.qi + 1);
  else if (S.repeat === 'all' || !auto) playIndex(0);
  else { pPause(); pSeek(0); }
}
function prev(){ if (pTime() > 3 || S.qi <= 0) { pSeek(0); return; } playIndex(S.qi - 1); }
function toggle(){
  const has = mode === 'yt' ? ytState !== -1 && !!current() : !!audio.src;
  if (!has) { if (current()) { playIndex(S.qi); return; } if (S.results.length) playList(S.results, 0); return; }
  pPaused() ? pPlay() : pPause();
}
function addToQueue(t){ S.queue.push(t); if (S.qi < 0) playIndex(S.queue.length-1); renderQueue(); toast('Added to queue'); }

function tickUI(){
  const d = pDur(), c = pTime();
  $('#cur').textContent = fmt(c); $('#dur').textContent = fmt(d);
  if (!seeking) { const p = d ? c / d * 1000 : 0; $('#seek').value = p; $('#seek').style.setProperty('--p', p/10 + '%'); const ns = document.getElementById('npSeek'); if (ns) { ns.value = p; ns.style.setProperty('--p', p/10 + '%'); } }
  const nc = document.getElementById('npCur'); if (nc) { nc.textContent = fmt(c); document.getElementById('npDur').textContent = fmt(d); }
}
audio.addEventListener('timeupdate', () => { if (mode === 'audio') tickUI(); });
audio.addEventListener('ended', () => { if (mode === 'audio') next(true); });
audio.addEventListener('play', syncPlay); audio.addEventListener('pause', syncPlay);
audio.addEventListener('error', () => { if (mode === 'audio' && audio.getAttribute('src')) { toast("Couldn't load this track — skipping"); setTimeout(() => next(true), 800); } });

let seeking = false;
const seek = $('#seek');
seek.addEventListener('input', () => { seeking = true; seek.style.setProperty('--p', seek.value/10 + '%'); $('#cur').textContent = fmt(seek.value/1000 * pDur()); });
seek.addEventListener('change', () => { seeking = false; if (pDur()) pSeek(seek.value/1000 * pDur()); });
const vol = $('#vol');
const syncVol = () => { vol.value = Math.round(audio.volume*100); vol.style.setProperty('--p', vol.value + '%'); $('#muteBtn').innerHTML = audio.muted || audio.volume === 0 ? I.mute : I.vol; applyVolume(); };

function syncPlay(){ const paused = pPaused(); $('#playBtn').innerHTML = paused ? I.play : I.pause; const np = document.getElementById('npPlay'); if (np) np.innerHTML = paused ? I.play : I.pause; try { highlight(); } catch {} document.body.classList.toggle('paused', paused); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = paused ? 'paused' : 'playing'; }
syncPlay();
$('#playBtn').onclick = toggle; $('#nextBtn').onclick = () => next(); $('#prevBtn').onclick = prev;
const syncModes = () => { $('#shuffleBtn').classList.toggle('on', S.shuffle); const r=$('#repeatBtn'); r.classList.toggle('on', S.repeat!=='off'); r.title = `Repeat: ${S.repeat}`; r.style.position='relative'; r.dataset.one = S.repeat==='one'; r.querySelector('.one')?.remove(); if (S.repeat==='one') r.insertAdjacentHTML('beforeend','<b class="one" style="position:absolute;font-size:9px;top:4px;right:4px">1</b>'); };

syncModes();

function mediaSession(t){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: t.artUrl ? [{ src: t.artUrl, sizes: '480x480' }] : [] });
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', pPlay); ms.setActionHandler('pause', pPause);
  ms.setActionHandler('nexttrack', () => next()); ms.setActionHandler('previoustrack', prev);
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (document.querySelector('.modal-bg')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) next();
  else if (e.key === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.key === 'ArrowRight') pSeek(pTime() + 10);
  else if (e.key === 'ArrowLeft') pSeek(pTime() - 10);
  else if (e.key.toLowerCase() === 'm') $('#muteBtn').click();
  else if (e.key.toLowerCase() === 's') $('#shuffleBtn').click();
  else if (e.key.toLowerCase() === 'r') $('#repeatBtn').click();
  else if (e.key === '/') { e.preventDefault(); go('search'); }
});

/* ---------- YouTube Data API (search + charts) ---------- */
const ytKey = () => store.get('ytKey', '');
const decodeHTML = h => { const t = document.createElement('textarea'); t.innerHTML = h; return t.value; };
const isoDur = d => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d || ''); return m ? (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0) : 0; };
const TAG = /\s*[\(\[][^\)\]]*\b(?:official|lyrics?|lyric video|audio|visuali[sz]er|music video|video|explicit|hd|4k|remastered)\b[^\)\]]*[\)\]]/ig;
function ytTrack(v){
  const sn = v.snippet || {}; let raw = decodeHTML(sn.title || '');
  raw = raw.replace(/\s*SMS\s*\[\s*Skiza[^\]]*\]\s*to\s*\d+/i, '').replace(TAG, '').replace(/\s*[|_]\s*(?:official.*|lyrics?)$/i, '').replace(/\s{2,}/g, ' ').trim();
  const ch = (sn.channelTitle || '').replace(/VEVO$/i, '').replace(/\s*-\s*Topic$/i, '').trim();
  let artist = ch, title = raw;
  const dash = raw.match(/^(.+?)\s+[-–—]\s+(.+)$/); if (dash) { artist = dash[1].trim(); title = dash[2].trim(); }
  const th = sn.thumbnails || {};
  return { id: 'yt:' + (v.id?.videoId || v.id), ytId: v.id?.videoId || v.id, title, artist, artistId: '', genre: 'YouTube',
    duration: isoDur(v.contentDetails?.duration), artUrl: (th.high || th.medium || th.default || {}).url || '', source: 'youtube', released: sn.publishedAt || '' };
}
async function ytApi(path, params){
  const q = new URLSearchParams({ ...params, key: ytKey() });
  const r = await fetch(`https://www.googleapis.com/youtube/v3/${path}?${q}`);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const reason = j.error?.errors?.[0]?.reason || ''; throw new Error(reason === 'quotaExceeded' ? 'Daily YouTube search limit reached — it resets at midnight Pacific time.' : reason === 'keyInvalid' || r.status === 400 ? 'Your YouTube API key is not valid.' : reason === 'accessNotConfigured' ? 'Turn on "YouTube Data API v3" for your key in Google Cloud.' : (j.error?.message || `YouTube error ${r.status}`)); }
  return j;
}
const ytCache = new Map();
async function ytSearch(q){
  const k = 's:' + q.toLowerCase(); if (ytCache.has(k)) return ytCache.get(k);
  const sr = await ytApi('search', { part: 'snippet', type: 'video', videoCategoryId: '10', videoEmbeddable: 'true', maxResults: '25', q });
  const ids = (sr.items || []).map(i => i.id.videoId).filter(Boolean);
  if (!ids.length) return [];
  const vr = await ytApi('videos', { part: 'snippet,contentDetails', id: ids.join(',') });
  const out = (vr.items || []).map(ytTrack).filter(t => t.duration > 45 && t.duration < 1200);
  ytCache.set(k, out); return out;
}
async function ytChart(){
  if (ytCache.has('chart')) return ytCache.get('chart');
  const vr = await ytApi('videos', { part: 'snippet,contentDetails', chart: 'mostPopular', videoCategoryId: '10', regionCode: store.get('ytRegion', 'KE'), maxResults: '30' });
  const out = (vr.items || []).map(ytTrack); ytCache.set('chart', out); return out;
}

/* ---------- Downloads ---------- */
async function download(t){
  if (S.downloads.has(t.id) || S.downloading.has(t.id)) return;
  S.downloading.set(t.id, 0); refreshActs(t.id);
  try {
    await getHost();
    const r = await fetch(streamUrl(t.id));
    if (!r.ok) throw new Error(r.status);
    const total = +r.headers.get('content-length') || 0;
    const reader = r.body.getReader(); const chunks = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (total) { S.downloading.set(t.id, got/total); refreshActs(t.id); } }
    const blob = new Blob(chunks, { type: r.headers.get('content-type') || 'audio/mpeg' });
    let art = null; if (t.artUrl) { try { const a = await fetch(t.artUrl); if (a.ok) art = await a.blob(); } catch {} }
    const meta = { ...t, size: blob.size, addedAt: Date.now() };
    await dbPut({ ...meta, audio: blob, art });
    if (art) meta.artUrl = URL.createObjectURL(art);
    S.downloads.set(t.id, meta); toast(`Downloaded “${t.title}”`);
  } catch (e) {
    toast('Download failed — check your connection'); console.error(e);
  } finally { S.downloading.delete(t.id); refreshActs(t.id); updateCounts(); if (S.view === 'downloads') render(); }
}
async function removeDownload(id){
  await dbDel(id); const m = S.downloads.get(id); S.downloads.delete(id);
  if (objectUrls.has(id)) { URL.revokeObjectURL(objectUrls.get(id)); objectUrls.delete(id); }
  toast(`Removed “${m?.title || 'track'}”`); updateCounts(); render();
}
async function saveToDevice(id){
  const rec = await dbGet(id); if (!rec?.audio) return;
  const ext = (rec.audio.type.split('/')[1] || 'mp3').replace('mpeg','mp3');
  const a = document.createElement('a'); a.href = URL.createObjectURL(rec.audio);
  a.download = `${rec.artist} - ${rec.title}.${ext}`.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importFiles(files){
  let n = 0, dup = 0;
  for (const f of files) {
    if (!f.type.startsWith('audio/')) continue;
    if ([...S.downloads.values()].some(d => d.source === 'local' && d.fileName === f.name && d.size === f.size)) { dup++; continue; }
    const name = f.name.replace(/\.[^.]+$/, '').replace(/^\s*\[\s*spotdownloader\.com\s*\]\s*/i, '').replace(TAG, '').replace(/\s*SMS\s*\[\s*Skiza[^\]]*\]\s*to\s*\d+/i, '').replace(/\s*[|_]\s*(?:official\s*)?(?:audio|lyrics?)\s*$/i, '').replace(/\s{2,}/g, ' ').trim();
    const dash = name.match(/^(.+?)\s+[-–—]\s+(.+)$/); const [artist, title] = dash ? [dash[1].trim(), dash[2].trim()] : ['Unknown artist', name];
    const meta = { id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2,7), title, artist, genre: 'Imported', duration: 0, artUrl: '', source: 'local', size: f.size, fileName: f.name, addedAt: Date.now() };
    const d = await new Promise(res => { const a = new Audio(); a.preload='metadata'; a.onloadedmetadata = () => { res(a.duration); URL.revokeObjectURL(a.src); }; a.onerror = () => res(0); a.src = URL.createObjectURL(f); });
    meta.duration = d || 0;
    await dbPut({ ...meta, audio: f, art: null }); S.downloads.set(meta.id, meta); n++;
  }
  toast(n ? `Imported ${n} song${n>1?'s':''}${dup ? ` (${dup} already in library)` : ''}` : dup ? 'Those songs are already in your library' : 'No audio files found'); updateCounts(); render();
}
$('#fileIn').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
$('#dirIn').onchange = e => { const f = [...e.target.files].filter(x => /\.(mp3|m4a|aac|ogg|opus|wav|flac|webm)$/i.test(x.name)); toast(`Importing ${f.length} songs…`); importFiles(f); e.target.value = ''; };

function toggleFollow(u){
  if (!u?.id) return;
  if (S.following.has(u.id)) { S.following.delete(u.id); toast(`Unfollowed ${u.name}`); }
  else { S.following.set(u.id, { id: u.id, name: u.name, handle: u.handle, avatar: u.avatar, verified: u.verified, followers: u.followers, followedAt: Date.now() }); toast(`Following ${u.name}`); }
  store.set('following', [...S.following]); S.feed = null; updateCounts();
  if (['artist','following','search','home'].includes(S.view)) render();
}
const followBtn = (u, mini) => { const on = S.following.has(u.id); return `<button class="${mini ? 'follow-mini' : 'btn'} ${on ? 'following' : ''}" data-follow="${esc(u.id)}">${on ? '✓ Following' : '+ Follow'}</button>`; };
function bindFollow(lookup){ document.querySelectorAll('[data-follow]').forEach(b => b.onclick = e => { e.stopPropagation(); const u = lookup(b.dataset.follow); if (u) toggleFollow(u); }); }
const relDate = d => { const t = Date.parse(d); if (!t) return ''; const days = Math.floor((Date.now() - t) / 864e5); return days < 1 ? 'Today' : days === 1 ? 'Yesterday' : days < 7 ? `${days} days ago` : days < 30 ? `${Math.floor(days/7)} wk ago` : new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: days > 330 ? 'numeric' : undefined }); };
async function loadFeed(){
  if (S.feedLoading) return; S.feedLoading = true; if (S.view === 'following') render();
  const ids = [...S.following.keys()].slice(-25);
  const lists = await Promise.all(ids.map(id => api(`/users/${encodeURIComponent(id)}/tracks`, { sort: 'date', limit: 6 }).catch(() => [])));
  const seen = new Set();
  S.feed = lists.flat().filter(t => t && t.is_streamable !== false).map(normalize)
    .filter(t => !seen.has(t.id) && seen.add(t.id))
    .sort((a,b) => (Date.parse(b.released)||0) - (Date.parse(a.released)||0)).slice(0, 60);
  S.feedLoading = false; if (S.view === 'following') render();
}
/* ---------- Playlists ---------- */
const savePls = () => { store.set('playlists', S.playlists); updateCounts(); renderSidePls(); };
const getPl = id => S.playlists.find(p => p.id === id);
const plMeta = t => ({ id: t.id, title: t.title, artist: t.artist, artistId: t.artistId || '', genre: t.genre || '', duration: t.duration || 0,
  artUrl: String(t.artUrl || '').startsWith('blob:') ? '' : (t.artUrl || ''), source: t.source, released: t.released || '', ytId: t.ytId || '' });
function createPlaylist(name, firstTrack){
  const pl = { id: 'pl' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), name: name.trim() || 'My playlist', tracks: firstTrack ? [plMeta(firstTrack)] : [], createdAt: Date.now() };
  S.playlists.push(pl); savePls(); toast(firstTrack ? `Added to ${pl.name}` : `Created ${pl.name}`); return pl;
}
function addToPlaylist(pl, t){
  if (pl.tracks.some(x => x.id === t.id)) { toast(`Already in ${pl.name}`); return; }
  pl.tracks.push(plMeta(t)); savePls(); toast(`Added to ${pl.name}`);
}
function removeFromPlaylist(pl, id){ pl.tracks = pl.tracks.filter(x => x.id !== id); savePls(); render(); }
function mosaicHTML(pl, size){
  const arts = [...new Set(pl.tracks.map(t => S.downloads.get(t.id)?.artUrl || t.artUrl).filter(Boolean))];
  const st = size ? `style="width:${size}px;height:${size}px;border-radius:14px"` : '';

  if (arts.length) return `<div class="mosaic one" ${st}><img src="${esc(arts[0])}" alt="" loading="lazy"></div>`;
  return `<div class="mosaic one" ${st}><div class="ph">♪</div></div>`;
}
const totalTime = list => { const m = Math.round(list.reduce((a,t) => a + (t.duration||0), 0) / 60); return m >= 60 ? `${Math.floor(m/60)} hr ${m%60} min` : `${m} min`; };

async function downloadAll(list){

  if (!todo.length) { toast('Everything here is already downloaded'); return; }
  toast(`Downloading ${todo.length} track${todo.length>1?'s':''}…`);

/* small in-app dialog (prompt/confirm replacement) */
function ask({ title, text = '', value, ok = 'OK', danger = false }){
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<form class="modal"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${value !== undefined ? `<input maxlength="80" value="${esc(value)}" placeholder="Playlist name">` : ''}<div class="row-btns"><button type="button" class="btn" data-x>Cancel</button><button class="btn ${danger?'danger':'primary'}">${esc(ok)}</button></div></form>`;
    const done = v => { bg.remove(); document.removeEventListener('keydown', esc_); res(v); };
    const esc_ = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', esc_);
    bg.onclick = e => { if (e.target === bg || e.target.closest('[data-x]')) done(null); };
    bg.querySelector('form').onsubmit = e => { e.preventDefault(); const inp = bg.querySelector('input'); done(inp ? inp.value.trim() || null : true); };
    document.body.appendChild(bg); const inp = bg.querySelector('input'); if (inp) { inp.focus(); inp.select(); }
  });
}
async function newPlaylistFlow(track){
  const name = await ask({ title: 'New playlist', value: `My playlist #${S.playlists.length + 1}`, ok: 'Create' });
  if (!name) return null; const pl = createPlaylist(name, track);
  if (!track) openPlaylist(pl.id); else if (S.view === 'playlists') render();
  return pl;
}

  m.innerHTML = `<button data-m="queue">${I.plus} Add to queue</button><button data-m="next">⏭&nbsp; Play next</button>

  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';

  const [k, id] = key.split(':');

  q.placeholder = S.src === 'youtube' ? 'What do you want to play?' : 'Search Audius songs and artists';
  q.onfocus = () => { if (S.view !== 'search') go('search'); };
  q.oninput = () => { clearTimeout(t); $('#searchBox').classList.toggle('has', !!q.value); t = setTimeout(() => run(q.value.trim()), S.src === 'youtube' ? 700 : 400); };
  q.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(t); run(q.value.trim(), true); q.blur(); } if (e.key === 'Escape') q.blur(); };
  $('#qClear').onclick = e => { e.preventDefault(); q.value = ''; run(''); q.focus(); };
})();

/* ---------- Data loading ---------- */
let reqId = 0;
async function loadTrending(){
  const my = ++reqId; S.loading = true; S.error = ''; render();
  try {
    const params = { time: 'week', limit: 50 }; if (S.genre !== 'All') params.genre = S.genre;
    const data = await api('/tracks/trending', params);
    if (my !== reqId) return; S.results = (data || []).filter(t => t.is_streamable !== false).map(normalize);
  } catch (e) { if (my === reqId) S.error = navigator.onLine ? 'The Audius API did not respond.' : "You're offline — your downloads still work."; }
  if (my === reqId) { S.loading = false; if (S.view === 'home') render(); }
}
let ytReq = 0;
async function runYT(q, force){
  if (!ytKey()) { render(); return; }
  if (!force && S.yt.q === q && !S.yt.error) { render(); return; }
  const my = ++ytReq; S.yt = { q, list: [], loading: true, error: '' }; render();
  try { const list = await ytSearch(q); if (my === ytReq) S.yt.list = list; }
  catch (e) { if (my === ytReq) S.yt.error = e.message; }
  if (my === ytReq) { S.yt.loading = false; if (S.view === 'search') render(); }
}
async function search(q, force){
  if (q === S.query && !force) return; S.query = q;
  if (!q) { S.results = []; render(); return; }
  const my = ++reqId; S.loading = true; S.error = ''; render();
  try {
    const [data, users] = await Promise.all([api('/tracks/search', { query: q, limit: 50 }), api('/users/search', { query: q, limit: 8 }).catch(() => [])]);
    if (my !== reqId) return;
    S.results = (data || []).filter(t => t.is_streamable !== false).map(normalize);
    S.artists = (users || []).map(normUser).sort((a,b) => b.followers - a.followers);
  }
  catch (e) { if (my === reqId) S.error = navigator.onLine ? 'Search failed.' : "You're offline — your downloads still work."; }
  if (my === reqId) { S.loading = false; if (S.view === 'search') render(); }
}
async function openArtist(id){
  if (!id) return;
  if (!(S.view === 'artist' && S.artist?.id === id)) pushHist();
  if (matchMedia('(max-width:760px)').matches) { document.body.classList.remove('np-open'); syncNPBtns(); }
  if (S.view !== 'artist') S.prevView = S.view;
  S.view = 'artist'; S.artist = { id, user: null, tracks: [], sort: 'plays', loading: true };
  $('#drawer').classList.remove('open'); render(); $('#main').scrollTop = 0;
  try {
    const u = await api(`/users/${encodeURIComponent(id)}`);
    if (S.artist?.id !== id) return;
    S.artist.user = normUser(u); render();
    await loadArtistTracks('plays');
  } catch (e) { if (S.artist?.id === id) { S.artist.error = navigator.onLine ? 'The Audius API did not respond.' : "You're offline."; S.artist.loading = false; render(); } }
}
async function loadArtistTracks(sort){
  const A = S.artist; if (!A) return;
  A.sort = sort; A.loading = true; render();
  try {
    const data = await api(`/users/${encodeURIComponent(A.id)}/tracks`, { sort, limit: 100 });
    if (S.artist !== A || A.sort !== sort) return;
    A.tracks = (data || []).filter(t => t.is_streamable !== false).map(normalize);
  } catch { A.tracks = []; toast("Couldn't load tracks"); }
  if (S.artist === A && A.sort === sort) { A.loading = false; if (S.view === 'artist') render(); }
}
function go(v, keep){
  if (S.view !== v) pushHist();
  if (matchMedia('(max-width:760px)').matches) { document.body.classList.remove('np-open'); syncNPBtns(); }
  S.view = v; $('#main').scrollTop = 0; $('#drawer').classList.remove('open');
  if (v === 'home') { if (keep && S.results.length && !S.query) { render(); return; } S.query = ''; loadTrending(); }
  else if (v === 'search') { S.results = S.query ? S.results : []; render(); if (!matchMedia('(hover:none)').matches && document.activeElement !== $('#q')) $('#q').focus({ preventScroll: true }); }
  else render();
}
document.querySelectorAll('.nav').forEach(n => n.onclick = () => go(n.dataset.view));

/* ---------- Installable app ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed', e)));
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').classList.add('show'); render(); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').classList.remove('show'); toast('Sauti installed'); render(); });
async function install(){ if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#installBtn').classList.remove('show'); render(); }
$('#installBtn').onclick = install;
window.addEventListener('online', () => { toast('Back online'); if (S.view === 'home' && S.error) loadTrending(); });
window.addEventListener('offline', () => toast("You're offline — downloads still play"));

/* ---------- Boot ---------- */
(async () => {
  try {
    for (const r of await dbAll()) { const { audio: _a, art, ...meta } = r; if (art) meta.artUrl = URL.createObjectURL(art); S.downloads.set(meta.id, meta); }
  } catch (e) { console.warn('IndexedDB unavailable', e); }
  updateCounts(); restoring = true; go('home'); restoring = false;
  const sp = $('#splash'); const hide = () => { sp.style.opacity = '0'; setTimeout(() => sp.remove(), 420); };
  const started = performance.now(); const wait = () => (!S.loading || performance.now() - started > 4000) ? setTimeout(hide, Math.max(0, 700 - (performance.now() - started))) : setTimeout(wait, 100); wait();
})();
</script>
