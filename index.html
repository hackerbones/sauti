<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sauti" />
<meta name="description" content="Stream full-length music for free and download tracks for offline listening." />
<title>Sauti — Stream & Download Music</title>
<meta name="theme-color" content="#0d0b10" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0d0b10; --panel:#16131b; --panel2:#1f1a26; --line:#2a2433;
    --text:#f2eef7; --muted:#9a91a8; --accent:#ff7a3d; --accent2:#ffb347; --good:#3ddc97;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:1fr 92px;height:100vh}
  /* sidebar */
  aside{grid-row:1;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
  .brand{font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:-.5px;padding:0 10px 18px;display:flex;align-items:center;gap:10px}
  .brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-style:normal;font-size:16px;color:#1a0d05}
  .nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left;width:100%}
  .nav:hover{color:var(--text);background:var(--panel2)}
  .nav.on{color:var(--text);background:var(--panel2)}
  .nav.on svg{color:var(--accent)}
  .nav .count{margin-left:auto;font-size:12px;background:var(--line);padding:2px 8px;border-radius:20px}
  .side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;line-height:1.5}
  .side-foot a{color:var(--accent2)}
  svg{width:20px;height:20px;flex:none}
  /* main */
  main{grid-row:1;overflow-y:auto;padding:26px 34px 40px}
  .top{display:flex;gap:14px;align-items:center;margin-bottom:26px}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:11px 18px}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex:1;background:none;border:0;outline:0}
  .btn{padding:10px 16px;border-radius:30px;background:var(--panel2);border:1px solid var(--line);font-weight:500;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  a.btn{color:var(--text);text-decoration:none}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d05;font-weight:600}
  h1{font-family:'Space Grotesk';font-size:34px;letter-spacing:-1px;margin-bottom:6px}
  .sub{color:var(--muted);margin-bottom:20px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
  .chip{padding:7px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  /* hero */
  .hero{display:flex;gap:24px;align-items:flex-end;padding:24px;border-radius:20px;margin-bottom:28px;background:radial-gradient(circle at 15% 20%,rgba(255,122,61,.35),transparent 55%),radial-gradient(circle at 90% 90%,rgba(255,179,71,.18),transparent 50%),var(--panel)}
  .hero img,.hero .ph{width:150px;height:150px;border-radius:14px;object-fit:cover;box-shadow:0 20px 40px rgba(0,0,0,.4)}
  .hero .tag{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--accent2);margin-bottom:6px}
  .hero h2{font-family:'Space Grotesk';font-size:30px;line-height:1.1;margin-bottom:6px}
  .hero p{color:var(--muted);margin-bottom:14px}
  /* track list */
  .list{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:34px 48px 1fr 120px 60px 116px;gap:14px;align-items:center;padding:8px 12px;border-radius:10px}
  .row:hover{background:var(--panel)}
  .row.playing .t-title{color:var(--accent)}
  .row .num{color:var(--muted);text-align:center;font-size:13px}
  .row .art{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--panel2)}
  .ph{display:grid;place-items:center;background:linear-gradient(135deg,#3a2a48,#241c2c);color:var(--muted)}
  .t-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-artist{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .genre{color:var(--muted);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .row .dur{color:var(--muted);font-size:13px;text-align:right}
  .acts{display:flex;justify-content:flex-end;gap:2px}
  .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .ic:hover{color:var(--text);background:var(--panel2)}
  .ic.on{color:var(--accent)}
  .ic.done{color:var(--good)}
  .ic:disabled{opacity:.6;cursor:default}
  .ring{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
  .eq b{width:3px;background:var(--accent);animation:eq 1s ease-in-out infinite}
  .eq b:nth-child(2){animation-delay:-.4s}.eq b:nth-child(3){animation-delay:-.7s}
  .paused .eq b{animation-play-state:paused}
  @keyframes eq{0%,100%{height:3px}50%{height:14px}}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty h3{color:var(--text);font-family:'Space Grotesk';font-size:20px;margin-bottom:8px}
  .storage{font-size:13px;color:var(--muted);margin:-8px 0 18px}
  .drop{border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);margin-bottom:20px;font-size:14px}
  .drop.over{border-color:var(--accent);color:var(--text)}
  /* player */
  footer{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 22px;gap:20px}
  .now{display:flex;gap:12px;align-items:center;min-width:0}
  .now img,.now .ph{width:56px;height:56px;border-radius:9px;object-fit:cover}
  .now div{min-width:0}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ctrl .btns{display:flex;align-items:center;gap:10px}
  .play{width:44px;height:44px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
  .play:hover{transform:scale(1.05)}
  .bar{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:12px;color:var(--muted)}
  .bar span{width:40px;text-align:center}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%));outline:0;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--text)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--text)}
  .right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
  .right input{max-width:110px}
  /* queue drawer */
  .drawer{position:fixed;right:0;top:0;bottom:92px;width:340px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;padding:20px;overflow-y:auto;z-index:5}
  .drawer.open{transform:none}
  .drawer h3{font-family:'Space Grotesk';margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .q-item{display:flex;gap:10px;align-items:center;padding:7px;border-radius:8px;cursor:pointer}
  .q-item:hover{background:var(--panel2)}
  .q-item.cur .t-title{color:var(--accent)}
  .q-item img,.q-item .ph{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none}
  .q-item > div{min-width:0;flex:1}
  .a-link{cursor:pointer}
  .a-link:hover{color:var(--text);text-decoration:underline}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;margin-bottom:14px}
  .back:hover{color:var(--text)}
  .artist-head{position:relative;border-radius:20px;overflow:hidden;margin-bottom:24px;background:var(--panel)}
  .artist-cover{height:190px;background:linear-gradient(135deg,#3a2a48,#241c2c) center/cover no-repeat}
  .artist-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--panel) 18%,transparent 70%)}
  .artist-info{position:relative;display:flex;gap:22px;align-items:flex-end;padding:0 26px 24px;margin-top:-90px;z-index:1}
  .avatar{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--panel);background:var(--panel2);flex:none;display:grid;place-items:center;font-size:44px;font-family:'Space Grotesk';color:var(--muted)}
  .artist-info h1{margin:0;display:flex;align-items:center;gap:8px}
  .verified{width:22px;height:22px;color:#4da3ff}
  .stats{color:var(--muted);font-size:14px;margin:4px 0 12px;display:flex;gap:14px;flex-wrap:wrap}
  .stats b{color:var(--text)}
  .bio{color:var(--muted);font-size:14px;line-height:1.55;max-width:720px;padding:0 26px 22px;position:relative;white-space:pre-line}
  .artist-btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn.following{border-color:var(--accent);color:var(--accent)}
  .follow-mini{margin-top:8px;padding:5px 12px;font-size:12px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .follow-mini:hover{border-color:var(--muted);color:var(--text)}
  .follow-mini.following{border-color:var(--accent);color:var(--accent)}
  .feed-date{color:var(--muted);font-size:12px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:3px;margin-bottom:16px}
  .seg button{padding:7px 16px;border-radius:30px;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--text);color:var(--bg)}
  .artists{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;margin-bottom:26px}
  .a-card{flex:none;width:130px;text-align:center;padding:12px 8px;border-radius:14px;cursor:pointer}
  .a-card:hover{background:var(--panel)}
  .a-card .avatar{width:100px;height:100px;margin:0 auto 10px;border:0;font-size:32px}
  .a-card .t-title{font-size:14px}
  h2.sec{font-family:'Space Grotesk';font-size:20px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:10}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .offline-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
  .app{height:100dvh;padding-top:env(safe-area-inset-top)}
  footer{padding-bottom:env(safe-area-inset-bottom)}
  #installBtn{display:none;margin-top:10px}
  #installBtn.show{display:inline-flex}
  @media (max-width:820px){
    .artist-info{flex-direction:column;align-items:flex-start;padding:0 18px 18px;margin-top:-70px}
    .avatar{width:110px;height:110px}
    .bio{padding:0 18px 18px}
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr 140px}
    aside{grid-row:1;flex-direction:row;padding:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
    .brand,.side-foot{display:none}
    .nav{width:auto;white-space:nowrap}
    main{grid-row:2;padding:18px}
    .row{grid-template-columns:48px 1fr 116px}
    .row .num,.row .genre,.row .dur{display:none}
    .hero img,.hero .ph{width:100px;height:100px}
    footer{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:10px 14px;gap:8px}
    .ctrl{grid-column:1/-1;grid-row:2}
    .right input{display:none}
    .drawer{width:100%;bottom:140px}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><i>♪</i>Sauti</div>
    <button class="nav on" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Discover</button>
    <button class="nav" data-view="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</button>
    <button class="nav" data-view="downloads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>Downloads<span class="count" id="dlCount">0</span></button>
    <button class="nav" data-view="liked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>Liked<span class="count" id="likeCount">0</span></button>
    <button class="nav" data-view="following"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>Following<span class="count" id="followCount">0</span></button>
    <button class="btn primary" id="installBtn">⤓ Install app</button>
    <div class="side-foot">Streaming free, artist-uploaded music from <a href="https://audius.co" target="_blank" rel="noopener">Audius</a>. Downloads are saved inside this app for offline play.</div>
  </aside>

  <main id="main"></main>

  <footer>
    <div class="now" id="now"><div class="ph" style="width:56px;height:56px;border-radius:9px">♪</div><div><div class="t-title">Nothing playing</div><div class="t-artist">Pick a track to start</div></div></div>
    <div class="ctrl">
      <div class="btns">
        <button class="ic" id="shuffleBtn" title="Shuffle (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="ic" id="prevBtn" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="play" id="playBtn" title="Play/Pause (Space)"></button>
        <button class="ic" id="nextBtn" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="ic" id="repeatBtn" title="Repeat (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    </div>
    <div class="right">
      <button class="ic" id="queueBtn" title="Queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h13M3 12h13M3 18h9M19 14v7m-3-3l3 3 3-3"/></svg></button>
      <button class="ic" id="muteBtn" title="Mute (M)"></button>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </footer>
</div>

<div class="drawer" id="drawer"><h3>Up next <button class="ic" id="closeQ">✕</button></h3><div id="qList"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="audio/*" multiple hidden>

<script>
/* ---------- Config ---------- */
const APP = 'Sauti';
const GENRES = ['All','Electronic','Hip-Hop/Rap','Alternative','R&B/Soul','Pop','Afrobeat','Reggae','Lo-Fi','House','Jazz','Rock','Ambient'];

/* ---------- Icons ---------- */
const I = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>',
  heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14v6h16v-6M12 4v11m0 0l-4-4m4 4l4-4"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if(!isFinite(s)||s<0) s=0; s=Math.floor(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
let toastT; const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); };
const store = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} } };
const artHTML = (t, cls='art') => t.artUrl ? `<img class="${cls}" src="${esc(t.artUrl)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls} ph',textContent:'♪'}))">` : `<div class="${cls} ph">♪</div>`;

/* ---------- Audius API ---------- */
let host = null;
async function getHost(){
  if (host) return host;
  // api.audius.co serves /v1 directly; fall back to a discovery node from its list
  try { const r = await fetch(`https://api.audius.co/v1/tracks/trending?limit=1&app_name=${APP}`); if (r.ok) return host='https://api.audius.co'; } catch {}
  const r = await fetch('https://api.audius.co'); const j = await r.json();
  const list = j.data || []; host = list[Math.floor(Math.random()*list.length)];
  if (!host) throw new Error('No Audius host available');
  return host;
}
async function api(path, params={}){
  const h = await getHost();
  const q = new URLSearchParams({...params, app_name: APP});
  const r = await fetch(`${h}/v1${path}?${q}`);
  if (!r.ok) throw new Error(`API ${r.status}`);
  return (await r.json()).data;
}
const normalize = t => ({
  id: String(t.id), title: t.title, artist: t.user?.name || t.user?.handle || 'Unknown artist',
  artistId: t.user?.id ? String(t.user.id) : '', artistHandle: t.user?.handle || '',
  genre: t.genre || '', duration: t.duration || 0, released: t.release_date || t.created_at || '',
  artUrl: t.artwork?.['480x480'] || t.artwork?.['150x150'] || '',
  source: 'audius', permalink: t.permalink ? `https://audius.co${t.permalink}` : '',
});
const normUser = u => ({
  id: String(u.id), name: u.name || u.handle || 'Unknown artist', handle: u.handle || '',
  bio: u.bio || '', location: u.location || '', verified: !!u.is_verified,
  followers: u.follower_count || 0, trackCount: u.track_count || 0,
  avatar: u.profile_picture?.['480x480'] || u.profile_picture?.['150x150'] || u.profile_picture?.['1000x1000'] || '',
  cover: u.cover_photo?.['2000x'] || u.cover_photo?.['640x'] || '',
});
const compact = n => n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(n);
const avatarHTML = u => u.avatar ? `<img class="avatar" src="${esc(u.avatar)}" alt="" loading="lazy">` : `<div class="avatar">${esc((u.name||'?')[0].toUpperCase())}</div>`;
const artistLink = t => t.artistId ? `<span class="a-link" data-artist="${esc(t.artistId)}">${esc(t.artist)}</span>` : esc(t.artist);
const streamUrl = id => `${host || 'https://api.audius.co'}/v1/tracks/${id}/stream?app_name=${APP}`;

/* ---------- IndexedDB (offline downloads) ---------- */
let dbP;
function db(){
  return dbP ||= new Promise((res, rej) => {
    const o = indexedDB.open('sauti', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('tracks', { keyPath: 'id' });
    o.onsuccess = () => res(o.result); o.onerror = () => rej(o.error);
  });
}
async function idb(mode, fn){ const d = await db(); return new Promise((res, rej) => { const tx = d.transaction('tracks', mode); const s = tx.objectStore('tracks'); const r = fn(s); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); }); }
const dbAll = () => idb('readonly', s => s.getAll());
const dbPut = v => idb('readwrite', s => s.put(v));
const dbDel = id => idb('readwrite', s => s.delete(id));
const dbGet = id => idb('readonly', s => s.get(id));

/* ---------- State ---------- */
const S = {
  view: 'home', genre: store.get('genre','All'), query: '',
  results: [], loading: false, error: '',
  downloads: new Map(),           // id -> meta (no blobs)
  downloading: new Map(),         // id -> progress 0..1
  liked: new Map(store.get('liked', [])),
  following: new Map(store.get('following', [])), feed: null, feedLoading: false,
  artists: [], artist: null, prevView: 'home',
  queue: [], qi: -1, shuffle: store.get('shuffle', false), repeat: store.get('repeat', 'off'),
};
const objectUrls = new Map();     // id -> blob url for offline audio/art

/* ---------- Audio ---------- */
const audio = new Audio(); audio.preload = 'auto';
audio.volume = store.get('vol', 80) / 100;

const current = () => S.queue[S.qi];
async function playIndex(i){
  if (i < 0 || i >= S.queue.length) return;
  S.qi = i; const t = current();
  let src;
  if (S.downloads.has(t.id)) {
    if (!objectUrls.has(t.id)) { const rec = await dbGet(t.id); if (rec?.audio) objectUrls.set(t.id, URL.createObjectURL(rec.audio)); }
    src = objectUrls.get(t.id);
  }
  if (!src) { if (t.source !== 'audius') { toast('File missing'); return; } await getHost().catch(()=>{}); src = streamUrl(t.id); }
  audio.src = src;
  try { await audio.play(); } catch (e) { if (e.name !== 'AbortError') toast('Playback blocked — press play'); }
  updateNow(); renderQueue(); highlight(); mediaSession(t);
}
function playList(list, i){ S.queue = list.slice(); if (S.shuffle) { const first = S.queue.splice(i,1)[0]; shuffleArr(S.queue); S.queue.unshift(first); i = 0; } playIndex(i); }
function shuffleArr(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function next(auto=false){
  if (!S.queue.length) return;
  if (auto && S.repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
  if (S.qi + 1 < S.queue.length) playIndex(S.qi + 1);
  else if (S.repeat === 'all' || !auto) playIndex(0);
  else { audio.pause(); audio.currentTime = 0; }
}
function prev(){ if (audio.currentTime > 3 || S.qi <= 0) { audio.currentTime = 0; return; } playIndex(S.qi - 1); }
function toggle(){ if (!audio.src) { if (S.results.length) playList(S.results, 0); return; } audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
function addToQueue(t){ S.queue.push(t); if (S.qi < 0) playIndex(S.queue.length-1); renderQueue(); toast('Added to queue'); }

audio.addEventListener('timeupdate', () => {
  const d = audio.duration || current()?.duration || 0;
  $('#cur').textContent = fmt(audio.currentTime); $('#dur').textContent = fmt(d);
  if (!seeking) { const p = d ? audio.currentTime / d * 1000 : 0; $('#seek').value = p; $('#seek').style.setProperty('--p', p/10 + '%'); }
});
audio.addEventListener('ended', () => next(true));
audio.addEventListener('play', syncPlay); audio.addEventListener('pause', syncPlay);
audio.addEventListener('error', () => { if (audio.src) toast("Couldn't load this track — skipping"); setTimeout(() => next(true), 800); });

let seeking = false;
const seek = $('#seek');
seek.addEventListener('input', () => { seeking = true; seek.style.setProperty('--p', seek.value/10 + '%'); $('#cur').textContent = fmt(seek.value/1000 * (audio.duration||0)); });
seek.addEventListener('change', () => { if (audio.duration) audio.currentTime = seek.value/1000 * audio.duration; seeking = false; });
const vol = $('#vol');
const syncVol = () => { vol.value = Math.round(audio.volume*100); vol.style.setProperty('--p', vol.value + '%'); $('#muteBtn').innerHTML = audio.muted || audio.volume === 0 ? I.mute : I.vol; };
vol.addEventListener('input', () => { audio.volume = vol.value/100; audio.muted = false; store.set('vol', +vol.value); syncVol(); });
$('#muteBtn').onclick = () => { audio.muted = !audio.muted; syncVol(); };
syncVol();

function syncPlay(){ $('#playBtn').innerHTML = audio.paused ? I.play : I.pause; document.body.classList.toggle('paused', audio.paused); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing'; }
syncPlay();
$('#playBtn').onclick = toggle; $('#nextBtn').onclick = () => next(); $('#prevBtn').onclick = prev;
const syncModes = () => { $('#shuffleBtn').classList.toggle('on', S.shuffle); const r=$('#repeatBtn'); r.classList.toggle('on', S.repeat!=='off'); r.title = `Repeat: ${S.repeat}`; r.style.position='relative'; r.dataset.one = S.repeat==='one'; r.querySelector('.one')?.remove(); if (S.repeat==='one') r.insertAdjacentHTML('beforeend','<b class="one" style="position:absolute;font-size:9px;top:4px;right:4px">1</b>'); };
$('#shuffleBtn').onclick = () => { S.shuffle = !S.shuffle; store.set('shuffle', S.shuffle); syncModes(); toast(S.shuffle ? 'Shuffle on' : 'Shuffle off'); };
$('#repeatBtn').onclick = () => { S.repeat = {off:'all', all:'one', one:'off'}[S.repeat]; store.set('repeat', S.repeat); syncModes(); toast(`Repeat ${S.repeat}`); };
syncModes();

function mediaSession(t){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: t.artUrl ? [{ src: t.artUrl, sizes: '480x480' }] : [] });
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => audio.play()); ms.setActionHandler('pause', () => audio.pause());
  ms.setActionHandler('nexttrack', () => next()); ms.setActionHandler('previoustrack', prev);
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) next();
  else if (e.key === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10);
  else if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 10);
  else if (e.key.toLowerCase() === 'm') $('#muteBtn').click();
  else if (e.key.toLowerCase() === 's') $('#shuffleBtn').click();
  else if (e.key.toLowerCase() === 'r') $('#repeatBtn').click();
  else if (e.key === '/') { e.preventDefault(); go('search'); }
});

/* ---------- Downloads ---------- */
async function download(t){
  if (S.downloads.has(t.id) || S.downloading.has(t.id)) return;
  S.downloading.set(t.id, 0); refreshActs(t.id);
  try {
    await getHost();
    const r = await fetch(streamUrl(t.id));
    if (!r.ok) throw new Error(r.status);
    const total = +r.headers.get('content-length') || 0;
    const reader = r.body.getReader(); const chunks = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (total) { S.downloading.set(t.id, got/total); refreshActs(t.id); } }
    const blob = new Blob(chunks, { type: r.headers.get('content-type') || 'audio/mpeg' });
    let art = null; if (t.artUrl) { try { const a = await fetch(t.artUrl); if (a.ok) art = await a.blob(); } catch {} }
    const meta = { ...t, size: blob.size, addedAt: Date.now() };
    await dbPut({ ...meta, audio: blob, art });
    if (art) meta.artUrl = URL.createObjectURL(art);
    S.downloads.set(t.id, meta); toast(`Downloaded “${t.title}”`);
  } catch (e) {
    toast('Download failed — check your connection'); console.error(e);
  } finally { S.downloading.delete(t.id); refreshActs(t.id); updateCounts(); if (S.view === 'downloads') render(); }
}
async function removeDownload(id){
  await dbDel(id); const m = S.downloads.get(id); S.downloads.delete(id);
  if (objectUrls.has(id)) { URL.revokeObjectURL(objectUrls.get(id)); objectUrls.delete(id); }
  toast(`Removed “${m?.title || 'track'}”`); updateCounts(); render();
}
async function saveToDevice(id){
  const rec = await dbGet(id); if (!rec?.audio) return;
  const ext = (rec.audio.type.split('/')[1] || 'mp3').replace('mpeg','mp3');
  const a = document.createElement('a'); a.href = URL.createObjectURL(rec.audio);
  a.download = `${rec.artist} - ${rec.title}.${ext}`.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importFiles(files){
  let n = 0;
  for (const f of files) {
    if (!f.type.startsWith('audio/')) continue;
    const name = f.name.replace(/\.[^.]+$/, ''); const [artist, title] = name.includes(' - ') ? name.split(' - ', 2) : ['Local file', name];
    const meta = { id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2,7), title, artist, genre: 'Imported', duration: 0, artUrl: '', source: 'local', size: f.size, addedAt: Date.now() };
    const d = await new Promise(res => { const a = new Audio(); a.preload='metadata'; a.onloadedmetadata = () => { res(a.duration); URL.revokeObjectURL(a.src); }; a.onerror = () => res(0); a.src = URL.createObjectURL(f); });
    meta.duration = d || 0;
    await dbPut({ ...meta, audio: f, art: null }); S.downloads.set(meta.id, meta); n++;
  }
  toast(n ? `Imported ${n} file${n>1?'s':''}` : 'No audio files found'); updateCounts(); render();
}
$('#fileIn').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };

function toggleFollow(u){
  if (!u?.id) return;
  if (S.following.has(u.id)) { S.following.delete(u.id); toast(`Unfollowed ${u.name}`); }
  else { S.following.set(u.id, { id: u.id, name: u.name, handle: u.handle, avatar: u.avatar, verified: u.verified, followers: u.followers, followedAt: Date.now() }); toast(`Following ${u.name}`); }
  store.set('following', [...S.following]); S.feed = null; updateCounts();
  if (['artist','following','search','home'].includes(S.view)) render();
}
const followBtn = (u, mini) => { const on = S.following.has(u.id); return `<button class="${mini ? 'follow-mini' : 'btn'} ${on ? 'following' : ''}" data-follow="${esc(u.id)}">${on ? '✓ Following' : '+ Follow'}</button>`; };
function bindFollow(lookup){ document.querySelectorAll('[data-follow]').forEach(b => b.onclick = e => { e.stopPropagation(); const u = lookup(b.dataset.follow); if (u) toggleFollow(u); }); }
const relDate = d => { const t = Date.parse(d); if (!t) return ''; const days = Math.floor((Date.now() - t) / 864e5); return days < 1 ? 'Today' : days === 1 ? 'Yesterday' : days < 7 ? `${days} days ago` : days < 30 ? `${Math.floor(days/7)} wk ago` : new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: days > 330 ? 'numeric' : undefined }); };
async function loadFeed(){
  if (S.feedLoading) return; S.feedLoading = true; if (S.view === 'following') render();
  const ids = [...S.following.keys()].slice(-25);
  const lists = await Promise.all(ids.map(id => api(`/users/${encodeURIComponent(id)}/tracks`, { sort: 'date', limit: 6 }).catch(() => [])));
  const seen = new Set();
  S.feed = lists.flat().filter(t => t && t.is_streamable !== false).map(normalize)
    .filter(t => !seen.has(t.id) && seen.add(t.id))
    .sort((a,b) => (Date.parse(b.released)||0) - (Date.parse(a.released)||0)).slice(0, 60);
  S.feedLoading = false; if (S.view === 'following') render();
}
function toggleLike(t){
  if (S.liked.has(t.id)) S.liked.delete(t.id); else S.liked.set(t.id, { ...t, artUrl: t.source === 'audius' && !String(t.artUrl).startsWith('blob:') ? t.artUrl : '' });
  store.set('liked', [...S.liked]); updateCounts(); refreshActs(t.id); if (S.view === 'liked') render();
}

function actsHTML(t){

}
function rowHTML(t, i){

function refreshActs(id){ document.querySelectorAll(`.row[data-id="${CSS.escape(id)}"] .acts`).forEach(el => { const t = shown.find(x => x.id === id); if (t) el.innerHTML = actsHTML(t); }); }
function highlight(){ document.querySelectorAll('.row').forEach(r => { const on = r.dataset.id === current()?.id; r.classList.toggle('playing', on); r.querySelector('.num').innerHTML = on ? '<span class="eq"><b></b><b></b><b></b></span>' : (+r.dataset.i + 1); }); }

        ${u.bio ? `<div class="bio">${esc(u.bio)}</div>` : ''}
      </div>
      <div class="seg"><button data-sort="plays" class="${A.sort==='plays'?'on':''}">Popular</button><button data-sort="date" class="${A.sort==='date'?'on':''}">Latest</button></div>
      ${A.loading ? `<div class="empty"><span class="ring" style="display:inline-block;width:28px;height:28px"></span></div>` : tracks.length ? listHTML(tracks) : `<div class="empty"><h3>No tracks yet</h3>This artist hasn't uploaded any streamable tracks.</div>`}`;
      $('#playAll')?.addEventListener('click', () => playList(tracks, 0));
      $('#shuffleAll')?.addEventListener('click', () => { const was = S.shuffle; S.shuffle = true; playList(tracks, Math.floor(Math.random()*tracks.length)); S.shuffle = was; });
      m.querySelectorAll('.seg button').forEach(b => b.onclick = () => loadArtistTracks(b.dataset.sort));
      bindFollow(() => u);
    }
    $('#backBtn').onclick = () => go(S.prevView === 'artist' ? 'home' : S.prevView, true);
  } else if (S.view === 'following') {
    const arts = [...S.following.values()].reverse();
    if (!arts.length) m.innerHTML = `<h1>Following</h1><div class="empty"><h3>You're not following anyone yet</h3>Open an artist's profile and tap <b>+ Follow</b> to get their new releases here.<br><br><button class="btn primary" onclick="go('search')">Find artists</button></div>`;
    else {
      if (!S.feed && !S.feedLoading) loadFeed();
      const feed = S.feed || [];
      m.innerHTML = `<div class="top" style="justify-content:space-between"><h1>Following</h1>${feed.length ? `<button class="btn primary" id="playAll">${I.play} Play new releases</button>` : ''}</div>
        <div class="artists">${arts.map(u => `<div class="a-card" data-artist="${esc(u.id)}">${avatarHTML(u)}<div class="t-title">${esc(u.name)}${u.verified ? ' ✓' : ''}</div>${followBtn(u, true)}</div>`).join('')}</div>
        <h2 class="sec">New releases</h2><div class="sub" style="margin-top:-6px">Latest uploads from the ${arts.length} artist${arts.length === 1 ? '' : 's'} you follow</div>
        ${S.feedLoading && !feed.length ? `<div class="empty"><span class="ring" style="display:inline-block;width:28px;height:28px"></span></div>` : feed.length ? listHTML(feed) : `<div class="empty"><h3>No releases found</h3>Check back later or <button class="btn" onclick="S.feed=null;render()">Refresh</button></div>`}`;
      m.querySelectorAll('.a-card').forEach(c => c.onclick = () => openArtist(c.dataset.artist));
      bindFollow(id => S.following.get(id));
      $('#playAll')?.addEventListener('click', () => playList(feed, 0));
      if (feed.length) document.querySelectorAll('#list .row').forEach((r, i) => { const d = relDate(feed[i]?.released); if (d) r.querySelector('.genre').innerHTML = `<span class="feed-date">${d}</span>`; });
    }
  } else if (S.view === 'liked') {
    const list = [...S.liked.values()].reverse();
    m.innerHTML = `<div class="top" style="justify-content:space-between"><h1>Liked songs</h1>${list.length?`<button class="btn primary" id="playAll">${I.play} Play all</button>`:''}</div>
      ${list.length ? listHTML(list) : `<div class="empty"><h3>Nothing liked yet</h3>Tap the heart on tracks you love.</div>`}`;
    $('#playAll')?.addEventListener('click', () => playList(list, 0));
  }
  bindList();
}
function body(){
  if (S.loading) return `<div class="empty"><span class="ring" style="display:inline-block;width:28px;height:28px"></span></div>`;
  if (S.error) return `<div class="empty"><h3>Couldn't reach the music server</h3>${esc(S.error)}<br><br><button class="btn" onclick="${S.view==='home'?'loadTrending()':'search(S.query,true)'}">Try again</button>${S.downloads.size?` <button class="btn" onclick="go('downloads')">Play downloads</button>`:''}</div>`;
  if (!S.results.length) return `<div class="empty"><h3>No tracks found</h3>Try another search or genre.</div>`;
  return listHTML(S.results);
}
function bindList(){
  const l = $('#list'); if (!l) return;
  l.onclick = e => {
    const row = e.target.closest('.row'); if (!row) return;
    const t = shown[+row.dataset.i]; const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'dl') download(t); else if (a === 'like') toggleLike(t); else if (a === 'q') addToQueue(t);
    else if (a === 'rm') removeDownload(t.id); else if (a === 'save') saveToDevice(t.id);
    else if (e.target.closest('[data-artist]')) openArtist(e.target.closest('[data-artist]').dataset.artist);
    else if (!e.target.closest('button')) { if (current()?.id === t.id) toggle(); else playList(shown, +row.dataset.i); }
  };
}
function updateNow(){
  const t = current(); if (!t) return;
  $('#now').innerHTML = `${artHTML(t,'')}<div><div class="t-title">${esc(t.title)}</div><div class="t-artist">${artistLink(t)}</div></div><button class="ic ${S.liked.has(t.id)?'on':''}" id="nowLike">${S.liked.has(t.id)?I.heartF:I.heart}</button>`;
  $('#nowLike').onclick = () => { toggleLike(t); updateNow(); };
  $('#now .a-link')?.addEventListener('click', e => openArtist(e.currentTarget.dataset.artist));
  document.title = `${t.title} · ${t.artist} — Sauti`;
}
function renderQueue(){
  $('#qList').innerHTML = S.queue.length ? S.queue.map((t,i) => `<div class="q-item ${i===S.qi?'cur':''}" data-i="${i}">${artHTML(t,'')}<div><div class="t-title">${esc(t.title)}</div><div class="t-artist">${esc(t.artist)}</div></div></div>`).join('') : '<div class="empty" style="padding:30px 0">Queue is empty</div>';
  $('#qList').querySelectorAll('.q-item').forEach(el => el.onclick = () => playIndex(+el.dataset.i));
}
function updateCounts(){ $('#dlCount').textContent = S.downloads.size; $('#likeCount').textContent = S.liked.size; $('#followCount').textContent = S.following.size; }
$('#queueBtn').onclick = () => { $('#drawer').classList.toggle('open'); renderQueue(); };
$('#closeQ').onclick = () => $('#drawer').classList.remove('open');

/* ---------- Data loading ---------- */
let reqId = 0;
async function loadTrending(){
  const my = ++reqId; S.loading = true; S.error = ''; render();
  try {
    const params = { time: 'week', limit: 50 }; if (S.genre !== 'All') params.genre = S.genre;
    const data = await api('/tracks/trending', params);
    if (my !== reqId) return; S.results = (data || []).filter(t => t.is_streamable !== false).map(normalize);
  } catch (e) { if (my === reqId) S.error = navigator.onLine ? 'The Audius API did not respond.' : "You're offline — your downloads still work."; }
  if (my === reqId) { S.loading = false; if (S.view === 'home') render(); }
}
async function search(q, force){
  if (q === S.query && !force) return; S.query = q;
  if (!q) { S.results = []; render(); return; }
  const my = ++reqId; S.loading = true; S.error = ''; render();
  try {
    const [data, users] = await Promise.all([api('/tracks/search', { query: q, limit: 50 }), api('/users/search', { query: q, limit: 8 }).catch(() => [])]);
    if (my !== reqId) return;
    S.results = (data || []).filter(t => t.is_streamable !== false).map(normalize);
    S.artists = (users || []).map(normUser).sort((a,b) => b.followers - a.followers);
  }
  catch (e) { if (my === reqId) S.error = navigator.onLine ? 'Search failed.' : "You're offline — your downloads still work."; }
  if (my === reqId) { S.loading = false; if (S.view === 'search') render(); }
}
async function openArtist(id){
  if (!id) return;
  if (S.view !== 'artist') S.prevView = S.view;
  S.view = 'artist'; S.artist = { id, user: null, tracks: [], sort: 'plays', loading: true };
  $('#drawer').classList.remove('open'); render(); $('#main').scrollTop = 0;
  try {
    const u = await api(`/users/${encodeURIComponent(id)}`);
    if (S.artist?.id !== id) return;
    S.artist.user = normUser(u); render();
    await loadArtistTracks('plays');
  } catch (e) { if (S.artist?.id === id) { S.artist.error = navigator.onLine ? 'The Audius API did not respond.' : "You're offline."; S.artist.loading = false; render(); } }
}
async function loadArtistTracks(sort){
  const A = S.artist; if (!A) return;
  A.sort = sort; A.loading = true; render();
  try {
    const data = await api(`/users/${encodeURIComponent(A.id)}/tracks`, { sort, limit: 100 });
    if (S.artist !== A || A.sort !== sort) return;
    A.tracks = (data || []).filter(t => t.is_streamable !== false).map(normalize);
  } catch { A.tracks = []; toast("Couldn't load tracks"); }
  if (S.artist === A && A.sort === sort) { A.loading = false; if (S.view === 'artist') render(); }
}
function go(v, keep){
  S.view = v; $('#drawer').classList.remove('open');
  if (v === 'home') { if (keep && S.results.length && !S.query) { render(); return; } S.query = ''; loadTrending(); }
  else if (v === 'search') { S.results = S.query ? S.results : []; render(); }
  else render();
}
document.querySelectorAll('.nav').forEach(n => n.onclick = () => go(n.dataset.view));

/* ---------- Installable app ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed', e)));
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').classList.add('show'); render(); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installBtn').classList.remove('show'); toast('Sauti installed'); render(); });
async function install(){ if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#installBtn').classList.remove('show'); render(); }
$('#installBtn').onclick = install;
window.addEventListener('online', () => { toast('Back online'); if (S.view === 'home' && S.error) loadTrending(); });
window.addEventListener('offline', () => toast("You're offline — downloads still play"));

/* ---------- Boot ---------- */
(async () => {
  try {
    for (const r of await dbAll()) { const { audio: _a, art, ...meta } = r; if (art) meta.artUrl = URL.createObjectURL(art); S.downloads.set(meta.id, meta); }
  } catch (e) { console.warn('IndexedDB unavailable', e); }
  updateCounts(); go('home');
})();
</script>
</body>
</html>
